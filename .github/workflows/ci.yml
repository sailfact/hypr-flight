name: CI
on:
    pull_request:
        branches: [develop, main]
    push:
        branches: [develop, main]

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Debug wayland pkg-config
              run: |
                    echo "--- installed wayland packages ---"
                    dpkg -l | grep -i wayland || echo "NONE INSTALLED"
                    echo "--- .pc files on disk ---"
                    find / -name "wayland-client.pc" 2>/dev/null || echo "NOT ON DISK"
                    echo "--- pkg-config default search path ---"
                    pkg-config --variable pc_path pkg-config
                    echo "--- current env ---"
                    echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
                    echo "PKG_CONFIG_LIBDIR=$PKG_CONFIG_LIBDIR"

            - name: Fix pkg-config search path
              run: echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"

            - uses: dtolnay/rust-toolchain@stable
              with:
                components: clippy, rustfmt

            - uses: Swatinem/rust-cache@v2

            - run: cargo fmt --check
            - run: cargo clippy --all-targets --all-features -- -D warnings
            - run: cargo test --all-features
